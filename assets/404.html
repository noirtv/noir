<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Not found — Noir</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #000; color: #fff; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(460px, 100%); }
    h1 { margin: 0; font-size: clamp(3.5rem, 11vw, 6.4rem); font-weight: 690; line-height: .86; letter-spacing: -.075em; }
    p { margin: 22px 0 0; color: rgba(255, 255, 255, .62); font-size: .92rem; line-height: 1.65; }
    a {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      border: 1px solid #fff;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-size: .84rem;
      font-weight: 650;
      text-decoration: none;
    }
    a:hover { background: #e9e9e9; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Not found<span style="color:rgba(255,255,255,.34)">.</span></h1>
    <p>This page doesn’t exist.</p>
    <a href="../">Open Noir</a>
  </main>
</body>
</html>
